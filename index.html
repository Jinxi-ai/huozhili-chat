<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霍知礼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff0f6; color: #7a4a5c; height: 100vh; display: flex; flex-direction: column; }
  .top { padding: 14px 16px; background: rgba(255,255,255,.8); border-bottom: 1px solid #ffd6e4; }
  .top h1 { font-size: 17px; color: #d1597f; }
  .top .sub { font-size: 12px; color: #b0899a; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; }
  .msg { max-width: 78%; margin-bottom: 10px; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.me { background: #ff9cbc; color: #fff; margin-left: auto; border-bottom-right-radius: 3px; }
  .msg.bot { background: #fff; color: #7a4a5c; border: 1px solid #ffd6e4; border-bottom-left-radius: 3px; }
  #bar { display: flex; gap: 8px; padding: 10px; background: rgba(255,255,255,.8); border-top: 1px solid #ffd6e4; }
  input { flex: 1; border: 1px solid #ffd6e4; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: #fff; color: #7a4a5c; }
  input::placeholder { color: #cba3b2; }
  button { border: none; border-radius: 10px; padding: 10px 16px; background: #ff9cbc; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .hint { text-align: center; font-size: 12px; color: #b0899a; padding: 4px; }
</style>
</head>
<body>
  <div class="top">
    <h1>🌸 霍知礼</h1>
    <div class="sub">念念的先生 · 在这陪你聊聊</div>
  </div>
  <div id="chat"></div>
  <div class="hint" id="hint"></div>
  <div id="bar">
    <input id="input" placeholder="说点什么…" autocomplete="off">
    <button id="send">发送</button>
  </div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const hint = document.getElementById('hint');
const KEY = new URLSearchParams(location.search).get('key') || '';
function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
async function doSend() {
  const text = input.value.trim();
  if (!text) return;
  add('me', text);
  input.value = '';
  send.disabled = true; hint.textContent = '先生正在想…';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ msg: text, key: KEY })
    });
    const j = await r.json();
    if (j.reply) { add('bot', j.reply); }
    else { add('bot', '(先生走神了，重试下)'); }
  } catch (e) { add('bot', '(网络断了，稍后再试)'); }
  send.disabled = false; hint.textContent = '';
}
send.onclick = doSend;
input.addEventListener('keydown', function(e){ if (e.key === 'Enter') doSend(); });
add('bot', '我在。你说。');
</script>
</body>
</html>
